name: Build verified artifacts

on:
  # Artifact-only entry point. All publication is owned by release.yml.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-checks:
    uses: ./.github/workflows/core-checks.yml
    with:
      ref: ${{ github.sha }}
  kernel-compat:
    uses: ./.github/workflows/kernel-compat.yml
    with:
      ref: ${{ github.sha }}
  windows-compat:
    uses: ./.github/workflows/windows-compat.yml
    with:
      ref: ${{ github.sha }}
  build-mac:
    needs: [core-checks, kernel-compat, windows-compat]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install distutils
        run: python3 -m pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npm run build

      # One run for both architectures: electron-builder merges every built
      # target into a single latest-mac.yml, so building arm64 and x64 in two
      # separate runs leaves only the second run's file (one arch) and breaks
      # per-arch auto-update selection.
      - name: Build Electron app (macOS arm64 + x64)
        run: npx electron-builder --mac --publish never
        env:
          CI: true

      - name: Verify packaged macOS runtime
        run: |
          node --test tests/mac-packaging.cjs
          node tests/mac-runtime.cjs

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asHub-mac-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  build-win:
    needs: [core-checks, kernel-compat, windows-compat]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install distutils
        run: python3 -m pip install setuptools

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npm run build

      - name: Build Electron app (Windows x64)
        run: npx electron-builder --win --x64 --publish never
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asHub-win-x64-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-linux:
    needs: [core-checks, kernel-compat, windows-compat]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libasound2t64 \
            libxtst6 \
            xdg-utils \
            libopenjp2-7

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript build
        run: npm run build

      - name: Build Electron app (Linux x64)
        run: npx electron-builder --linux --x64 --publish never
        env:
          CI: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asHub-linux-x64-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
