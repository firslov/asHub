name: Kernel compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  kernel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply release version for validation
        if: inputs.version != ''
        env:
          ASHUB_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs
      - run: npm ci
      - run: npm run typecheck:web
      - run: npm run test:kernel
      - run: npm run test:steering
      - run: npm run test:compaction
      - run: node --test tests/kernel-patch.cjs tests/codex-browser.mjs tests/regression-dependencies.cjs
