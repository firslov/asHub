name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.19.9)'
        required: true
        type: string
      source_sha:
        description: 'Optional exact source commit (used by tag releases)'
        required: false
        type: string

concurrency:
  group: ashub-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ] && ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be an exact commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate version
        env:
          ASHUB_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs --check
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core-checks:
    needs: prepare
    uses: ./.github/workflows/core-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}
  kernel-compat:
    needs: prepare
    uses: ./.github/workflows/kernel-compat.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}
  windows-compat:
    needs: prepare
    uses: ./.github/workflows/windows-compat.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}

  tag:
    needs: [prepare, core-checks, kernel-compat, windows-compat]
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Include drafts and older releases. Do not mistake an API failure
          # for absence or move a tag that already identifies a Release.
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if [[ $'\n'"$tags"$'\n' == *$'\n'"v$RELEASE_VERSION"$'\n'* ]]; then
            echo "::error::GitHub Release v$RELEASE_VERSION already exists. Use a new version to rebuild, or Sync release to COS with the existing release assets."
            exit 1
          fi
      - name: Prepare the validated version metadata
        env:
          ASHUB_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs
      - name: Commit version metadata and tag the validated source
        id: commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACTOR: ${{ github.actor }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email "$RELEASE_ACTOR@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $RELEASE_VERSION"
          fi
          # Refuse a non-fast-forward main update if another change landed
          # during validation. Never merge untested source into this release.
          if [ "$DISPATCH_REF" = refs/heads/main ] && [ -z "$SOURCE_SHA" ]; then
            git push origin HEAD:refs/heads/main
          fi
          git tag -f "v$RELEASE_VERSION"
          git push --force origin "refs/tags/v$RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            flags: --mac
          - os: windows-latest
            target: win
            flags: --win
          - os: ubuntu-latest
            target: linux
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - if: matrix.target == 'win'
        run: node scripts/pre-dist-win.cjs
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - name: Verify packaged macOS runtime
        if: matrix.target == 'mac'
        run: |
          node --test tests/mac-packaging.cjs
          node tests/mac-runtime.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - run: ls -la release/
      - name: Verify the tag still identifies the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag changed after validation; refusing to publish mismatched artifacts"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Workflow tooling must exist even for an older source_sha.
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Publish GitHub release and upload to COS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Match assetNames() in scripts/resync-cos.cjs. The Linux AppImage
          # embeds its blockmap and does not have a separate sidecar.
          installers_with_blockmaps=(asHub-"$RELEASE_VERSION"-{arm64,x64}.{dmg,zip} "asHub-Setup-$RELEASE_VERSION.exe")
          payloads=("${installers_with_blockmaps[@]}" "asHub-$RELEASE_VERSION.AppImage")
          for f in "${installers_with_blockmaps[@]}"; do payloads+=("$f.blockmap"); done
          metadata=(latest.yml latest-mac.yml latest-linux.yml)
          for f in "${payloads[@]}" "${metadata[@]}"; do
            if [ ! -f "release/$f" ] || [ ! -s "release/$f" ]; then
              echo "::error::Missing or empty COS update asset: $f"
              exit 1
            fi
          done

          mirror=true
          if [ -z "${COS_SECRET_ID:-}" ] && [ -z "${COS_SECRET_KEY:-}" ]; then
            mirror=false
          elif [ -z "${COS_SECRET_ID:-}" ] || [ -z "${COS_SECRET_KEY:-}" ]; then
            echo "::error::COS credentials are incomplete"
            exit 1
          else
            umask 077
            pip install --quiet coscmd
            # Check before creating the GitHub Release too, so a conflict with
            # an older/orphaned COS release cannot leave two different builds
            # of the same version. The shared workflow lock serializes writers.
            python3 release-tools/scripts/check-cos-mirror.py new "$RELEASE_VERSION" release "${payloads[@]}"
            coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
              -b ashub-release-1258678103 -e cos.accelerate.myqcloud.com --retry 10
          fi

          # Create, never edit or replace. gh uploads assets before exposing
          # the Release; keep the versioned asset names and updater metadata.
          files=()
          for f in release/*; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "v$RELEASE_VERSION" --notes '' "${files[@]}"
          if [ "$mirror" = false ]; then
            echo "COS credentials not set — skipping upload"
            exit 0
          fi

          # GitHub is now the recovery source. A failed mirror can be retried
          # with the original, verified assets, not by rebuilding this version.
          trap 'echo "::error::COS upload failed. Retry with Sync release to COS for v$RELEASE_VERSION, not Release." >&2' ERR
          # Do not expose any new update manifest until every payload upload
          # has succeeded. The shell exits on any failed coscmd upload.
          for f in "${payloads[@]}"; do
            coscmd upload -f -y "release/$f" /
          done
          for f in "${metadata[@]}"; do
            coscmd upload -f -y "release/$f" /
          done
          # Remove unpacked app dirs / junk left by earlier uploads (they are
          # build byproducts, not update artifacts, and just waste storage).
          for d in linux-unpacked win-unpacked mac mac-arm64 mac-universal; do
            coscmd delete -r -f "$d/" 2>/dev/null || true
          done
          coscmd delete -f ".DS_Store" 2>/dev/null || true
          echo "Uploaded to https://ashub-release-1258678103.cos.ap-beijing.myqcloud.com/"
