name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.19.8)'
        required: true
        type: string
        default: '0.19.8'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Commit as the workflow trigger (repo owner), not the GitHub bot,
          # so automated version bumps don't add a bot entry to contributors.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
      - run: |
          CUR=$(node -p "require('./package.json').version")
          if [ "$CUR" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
            git add package.json
            git commit -m "chore: bump version to ${{ inputs.version }}"
          fi
      - run: |
          git tag -d v${{ inputs.version }} 2>/dev/null || true
          git push origin :refs/tags/v${{ inputs.version }} 2>/dev/null || true
          git tag v${{ inputs.version }}
          git push origin main --tags

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            flags: --mac
          - os: windows-latest
            target: win
            flags: --win
          - os: ubuntu-latest
            target: linux
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - if: matrix.target == 'win'
        run: bash scripts/pre-dist-win.sh
        shell: bash
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - run: ls -la release/
      # Re-run safety: delete an existing release for this tag so
      # action-gh-release can recreate it (a fresh tag was pushed above).
      - name: Remove existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            gh release delete "v${{ inputs.version }}" --yes
            echo "removed existing release v${{ inputs.version }}"
          else
            echo "no existing release"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: release/*
