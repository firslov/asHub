# One-off recovery branch; do not merge into main.
name: Recover existing v0.21.9 artifacts
"on":
  workflow_dispatch: {}
concurrency:
  group: ashub-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: ${{ github.repository == 'firslov/asHub' && github.ref == 'refs/heads/ops/recover-v0.21.9' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify original release inputs, validation jobs, and build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: "45627949887"
          SOURCE_SHA: 4001324928ec208b9110e1034373fa9b0dc53239
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          gh api "$base/attempts/2" | jq -e --arg sha "$SOURCE_SHA" '
            .path == ".github/workflows/release.yml" and .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "failure"'
          gh api "$base/attempts/2/jobs?per_page=100" | jq -e '
            [.jobs[] | select(.name | startswith("build ("))] as $build
            | [.jobs[] | select(.name == "release")] as $release
            | ($build | length) == 3 and all($build[]; .conclusion == "success")
              and ($release | length) == 1 and $release[0].conclusion == "failure"
              and ([.jobs[] | select(.name == "tag" and .conclusion == "success")] | length) == 1'
          gh api "$base/artifacts?per_page=100" | jq -e '
            .total_count == 3 and ([.artifacts[].name] | sort) == ["linux", "mac", "win"]
            and all(.artifacts[]; .expired == false and .size_in_bytes > 0)'
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 45627949887
      - run: ls -la release/
      - name: Verify the tag still identifies the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 0.21.9
          EXPECTED_COMMIT: ebd1dc5906e35669bc22bb22424e5b7966fbd982
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag changed after validation; refusing to publish mismatched artifacts"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Publish GitHub release and upload to COS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          RELEASE_VERSION: 0.21.9
        run: |
          set -euo pipefail

          # Match assetNames() in scripts/resync-cos.cjs. The Linux AppImage
          # embeds its blockmap and does not have a separate sidecar.
          installers_with_blockmaps=(asHub-"$RELEASE_VERSION"-{arm64,x64}.{dmg,zip} "asHub-Setup-$RELEASE_VERSION.exe")
          payloads=("${installers_with_blockmaps[@]}" "asHub-$RELEASE_VERSION.AppImage")
          for f in "${installers_with_blockmaps[@]}"; do payloads+=("$f.blockmap"); done
          metadata=(latest.yml latest-mac.yml latest-linux.yml)
          for f in "${payloads[@]}" "${metadata[@]}"; do
            if [ ! -f "release/$f" ] || [ ! -s "release/$f" ]; then
              echo "::error::Missing or empty COS update asset: $f"
              exit 1
            fi
          done

          mirror=true
          if [ -z "${COS_SECRET_ID:-}" ] && [ -z "${COS_SECRET_KEY:-}" ]; then
            mirror=false
          elif [ -z "${COS_SECRET_ID:-}" ] || [ -z "${COS_SECRET_KEY:-}" ]; then
            echo "::error::COS credentials are incomplete"
            exit 1
          else
            umask 077
            pip install --quiet coscmd
            # Check before creating the GitHub Release too, so a conflict with
            # an older/orphaned COS release cannot leave two different builds
            # of the same version. The shared workflow lock serializes writers.
            python3 release-tools/scripts/check-cos-mirror.py new "$RELEASE_VERSION" release "${payloads[@]}"
            coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
              -b ashub-release-1258678103 -e cos.accelerate.myqcloud.com --retry 10
          fi

          # Create, never edit or replace. gh uploads assets before exposing
          # the Release; keep the versioned asset names and updater metadata.
          files=()
          for f in release/*; do
            if [ -f "$f" ]; then files+=("$f"); fi
          done
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "v$RELEASE_VERSION" --notes '' "${files[@]}"
          if [ "$mirror" = false ]; then
            echo "COS credentials not set — skipping upload"
            exit 0
          fi

          # GitHub is now the recovery source. A failed mirror can be retried
          # with the original, verified assets, not by rebuilding this version.
          trap 'echo "::error::COS upload failed. Retry with Sync release to COS for v$RELEASE_VERSION, not Release." >&2' ERR
          # Do not expose any new update manifest until every payload upload
          # has succeeded. The shell exits on any failed coscmd upload.
          for f in "${payloads[@]}"; do
            coscmd upload -f -y "release/$f" /
          done
          for f in "${metadata[@]}"; do
            coscmd upload -f -y "release/$f" /
          done
          # Remove unpacked app dirs / junk left by earlier uploads (they are
          # build byproducts, not update artifacts, and just waste storage).
          for d in linux-unpacked win-unpacked mac mac-arm64 mac-universal; do
            coscmd delete -r -f "$d/" 2>/dev/null || true
          done
          coscmd delete -f ".DS_Store" 2>/dev/null || true
          echo "Uploaded to https://ashub-release-1258678103.cos.ap-beijing.myqcloud.com/"
