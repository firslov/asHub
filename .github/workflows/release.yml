name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.19.9)'
        required: true
        type: string
      source_sha:
        description: 'Optional exact source commit (used by tag releases)'
        required: false
        type: string

concurrency:
  group: ashub-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate source input
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ] && ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be an exact commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate version
        env:
          ASHUB_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs --check
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  core-checks:
    needs: prepare
    uses: ./.github/workflows/core-checks.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}
  kernel-compat:
    needs: prepare
    uses: ./.github/workflows/kernel-compat.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}
  windows-compat:
    needs: prepare
    uses: ./.github/workflows/windows-compat.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ inputs.version }}

  tag:
    needs: [prepare, core-checks, kernel-compat, windows-compat]
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare the validated version metadata
        env:
          ASHUB_RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.cjs
      - name: Commit version metadata and tag the validated source
        id: commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ACTOR: ${{ github.actor }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          git config user.name "$RELEASE_ACTOR"
          git config user.email "$RELEASE_ACTOR@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $RELEASE_VERSION"
          fi
          # Refuse a non-fast-forward main update if another change landed
          # during validation. Never merge untested source into this release.
          if [ "$DISPATCH_REF" = refs/heads/main ] && [ -z "$SOURCE_SHA" ]; then
            git push origin HEAD:refs/heads/main
          fi
          git tag -f "v$RELEASE_VERSION"
          git push --force origin "refs/tags/v$RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            flags: --mac
          - os: windows-latest
            target: win
            flags: --win
          - os: ubuntu-latest
            target: linux
            flags: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - if: matrix.target == 'win'
        run: node scripts/pre-dist-win.cjs
      - run: npx electron-builder ${{ matrix.flags }} --publish never
      - name: Verify packaged macOS runtime
        if: matrix.target == 'mac'
        run: |
          node --test tests/mac-packaging.cjs
          node tests/mac-runtime.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: [build, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - run: ls -la release/
      - name: Verify the tag still identifies the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.tag.outputs.commit }}
        run: |
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" --jq .object.sha)
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Release tag changed after validation; refusing to publish mismatched artifacts"
            exit 1
          fi
      # Re-run safety: delete an existing release for this tag so
      # action-gh-release can recreate it (a fresh tag was pushed above).
      - name: Remove existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # --repo is required: this job has no checkout, and gh otherwise
          # fails with "not a git repository" — which the 2>&1 on the old
          # view call swallowed, so the cleanup silently never ran and a
          # re-release kept the previous assets.  Leaving stderr alone means
          # a real failure (auth, rate limit) reaches the log now.
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release delete "v$RELEASE_VERSION" --yes --repo "$GITHUB_REPOSITORY"
            echo "removed existing release v$RELEASE_VERSION"
          else
            echo "no existing release for v$RELEASE_VERSION"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: release/*
      # Upload artifacts to Tencent COS so the updater can download from a
      # fast domestic endpoint instead of the slow VPS→GitHub link.
      - name: Upload to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ]; then
            echo "COS credentials not set — skipping upload"
            exit 0
          fi
          pip install --quiet coscmd
          # Use the global-acceleration endpoint (cos.accelerate.myqcloud.com)
          # so the cross-pacific upload from the GitHub runner rides Tencent's
          # backbone instead of the slow public internet path.
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" \
            -b ashub-release-1258678103 -e cos.accelerate.myqcloud.com --retry 10
          # Only upload what auto-update needs: the latest*.yml metadata,
          # the installers, and their blockmaps.  Skip the unpacked app
          # dirs (linux-unpacked/win-unpacked/mac*) — they're build
          # byproducts, not update artifacts.
          for f in release/latest*.yml release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.blockmap; do
            [ -f "$f" ] && coscmd upload "$f" /
          done
          # Remove unpacked app dirs / junk left by earlier uploads (they are
          # build byproducts, not update artifacts, and just waste storage).
          for d in linux-unpacked win-unpacked mac mac-arm64 mac-universal; do
            coscmd delete -r -f "$d/" 2>/dev/null || true
          done
          coscmd delete -f ".DS_Store" 2>/dev/null || true
          echo "Uploaded to https://ashub-release-1258678103.cos.ap-beijing.myqcloud.com/"
