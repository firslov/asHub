appId: com.ashub.app
productName: asHub
copyright: Copyright © 2024

files:
  - dist/**/*
  - electron/**/*
  - examples/extensions/kimi-coding-plan/{*.mjs,ashub-plugin.json,package.json,LICENSE}
  - examples/extensions/project-management/{*.mjs,ashub-plugin.json,package.json}
  - examples/extensions/browser-automation/{*.mjs,ashub-plugin.json,package.json}
  - examples/extensions/image-display/{*.mjs,ashub-plugin.json,package.json}
  - examples/extensions/multi-machine/{*.mjs,ashub-plugin.json,package.json}
  - examples/extensions/scheduled-tasks/{*.mjs,ashub-plugin.json,package.json,README.md}
  - examples/extensions/voice-input/{*.mjs,ashub-plugin.json,package.json,README.md}
  - examples/extensions/personal-assistant/{*.mjs,ashub-plugin.json,package.json,README.md}
  - node_modules/**/*
  - '!node_modules/.ashub-integration-kernel.json'
  - '!node_modules/.ashub-integration-kernel.json.*.tmp'
  - package.json

asar: false

npmRebuild: false

beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.cjs

extraResources:
  - from: web/
    to: web/
    filter:
      - "**/*"

mac:
  files:
    - examples/extensions/desktop-control/{index.js,ashub-plugin.json,package.json,README.md,LICENSE}
    - examples/extensions/desktop-control/dist/**/*.js
    - examples/extensions/desktop-control/docs/arc-cua-license.txt
    - examples/extensions/desktop-control/scripts/ashub-setup.mjs
    - examples/extensions/desktop-control/native/capture
  artifactName: asHub-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extendInfo:
    NSMicrophoneUsageDescription: 点击语音输入后，asHub 使用麦克风将录音转为可编辑的草稿。
  category: public.app-category.developer-tools
  # Ad-hoc signed, not notarized: hardened runtime stays off so it doesn't block
  # user extensions' native modules.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  icon: electron/icon.icns

win:
  artifactName: asHub-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
  icon: electron/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: asHub

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  icon: electron/icon.png

publish:
  provider: github
  owner: firslov
  repo: ashub

directories:
  output: release
