<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远程工作空间 · asHub</title><link rel="icon" href="/assets/brand/icon.svg"><link rel="stylesheet" href="/vendor/fonts/fonts.css"><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/image-resources.css"><link rel="stylesheet" href="/css/file-preview.css"><link rel="stylesheet" href="/css/panels.css"><link rel="stylesheet" href="/css/workspace.css"><link rel="stylesheet" href="/css/backend-workspace.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><script defer src="/vendor/katex/katex.min.js"></script><script defer src="/vendor/marked.min.js"></script><script defer src="/js/markdown-compat.js"></script><script defer src="/vendor/dompurify.min.js"></script><script defer src="/js/image-resources.js"></script><script defer src="/js/conversation-presentation.js"></script><script defer src="/js/file-preview.js"></script><script defer src="/js/file-preview-renderers.js"></script><script type="module" src="/js/backend-workspace.js"></script></head>
<body class="backend-workspace"><aside><div class="bw-brand"><img src="/assets/brand/icon.svg" alt=""><span>asHub</span></div><div class="bw-device"><strong id="device-name">远程工作空间</strong><span id="device-status">正在连接</span></div><div class="bw-side-actions"><button id="create">＋ 新建对话</button><button id="refresh" aria-label="刷新列表">↻</button></div><input id="search" type="search" placeholder="搜索项目与对话" aria-label="搜索项目与对话"><nav id="sessions" aria-label="远程对话"></nav><p class="bw-side-note">任务在所选电脑执行</p></aside><main><header><div><h1 id="title">选择一个对话</h1><span id="connection">工作，在这里继续</span></div><button id="settings" hidden>对话设置</button><button id="theme" aria-label="切换配色">◐</button></header><p id="notice" role="status" hidden></p><section id="messages" aria-label="对话内容"><div class="bw-empty"><h2>连接你的工作</h2><p>从左侧打开一个对话，继续远程电脑上的任务。</p></div></section><footer><div id="receipt" hidden></div><div id="queue"></div><div id="attachments"></div><form id="composer"><textarea id="query" rows="3" maxlength="200000" placeholder="写下你的想法…" aria-label="消息内容" disabled></textarea><div class="bw-composer-actions"><label class="bw-upload" title="添加图片">＋<input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label><button id="model" type="button" disabled>选择模型</button><select id="delivery" aria-label="发送方式"><option value="queue">排队发送</option><option value="steer">中途补充</option></select><span class="bw-spacer"></span><button id="stop" type="button" hidden>停止</button><button id="send" type="submit" disabled aria-label="发送">↑</button></div></form></footer></main><dialog id="dialog"><header><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭">×</button></header><div id="dialog-body"></div></dialog></body></html>
